name: Unit Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create dummy env.properties
        run: |
          cat > env.properties <<'EOF'
          debug.store.password=dummy
          debug.store.key.alias=dummy
          debug.store.key.password=dummy
          prod.store.password=dummy
          prod.store.key.alias=dummy
          prod.store.key.password=dummy
          EOF

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
